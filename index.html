<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzed9eGYsAwTXO3b81BTxMnlaU1qCuPbdjiPFmvKecE9tK-WhUlNaRk4rMhoOAVyuy6/exec";

let user = null;
let tx = [];

const $ = id => document.getElementById(id);

const money = n =>
  new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(n) || 0);


/* =====================================================
   LOGIN / DAFTAR TAB
   ===================================================== */

function showAuth(x) {

  $("loginForm").classList.toggle(
    "hidden",
    x !== "login"
  );

  $("regForm").classList.toggle(
    "hidden",
    x !== "reg"
  );

  $("tabLogin").classList.toggle(
    "on",
    x === "login"
  );

  $("tabReg").classList.toggle(
    "on",
    x === "reg"
  );

  $("authMsg").textContent = "";

}


/* =====================================================
   HUBUNGAN KE GOOGLE APPS SCRIPT
   ===================================================== */

async function api(action, data = {}) {

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        action: action,

        ...data

      })

    });


    const text =
      await response.text();


    let result;

    try {

      result = JSON.parse(text);

    } catch (e) {

      console.error(
        "Jawaban server:",
        text
      );

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "Terjadi kesalahan."
      );

    }


    return result;


  } catch (error) {

    console.error(
      "API ERROR:",
      error
    );

    throw new Error(
      error.message ||
      "Gagal terhubung ke Google Sheets."
    );

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

$("loginForm").onsubmit =
async function(e) {

  e.preventDefault();


  $("authMsg").textContent =
    "Sedang masuk...";


  try {

    const result =
      await api(
        "login",
        {

          email:
            $("loginEmail").value
              .trim()
              .toLowerCase(),

          password:
            $("loginPw").value

        }
      );


    user =
      result.user;


    sessionStorage.setItem(
      "duitUser",
      JSON.stringify(user)
    );


    $("loginPw").value = "";


    openApp();


  } catch (error) {

    $("authMsg").textContent =
      error.message;

  }

};


/* =====================================================
   PENDAFTARAN
   ===================================================== */

$("regForm").onsubmit =
async function(e) {

  e.preventDefault();


  const nama =
    $("regName").value.trim();

  const email =
    $("regEmail").value
      .trim()
      .toLowerCase();

  const password =
    $("regPw").value;

  const password2 =
    $("regPw2").value;


  if (!nama) {

    $("authMsg").textContent =
      "Nama wajib diisi.";

    return;

  }


  if (!email) {

    $("authMsg").textContent =
      "Email wajib diisi.";

    return;

  }


  if (password.length < 8) {

    $("authMsg").textContent =
      "Password minimal 8 karakter.";

    return;

  }


  if (password !== password2) {

    $("authMsg").textContent =
      "Konfirmasi password tidak sama.";

    return;

  }


  $("authMsg").textContent =
    "Mendaftarkan akun...";


  try {

    await api(
      "register",
      {

        nama:
          nama,

        email:
          email,

        password:
          password

      }
    );


    $("regName").value = "";
    $("regEmail").value = "";
    $("regPw").value = "";
    $("regPw2").value = "";


    showAuth("login");


    $("authMsg").textContent =
      "Pendaftaran berhasil. Silakan masuk.";


  } catch (error) {

    $("authMsg").textContent =
      error.message;

  }

};


/* =====================================================
   TAMBAH TRANSAKSI
   ===================================================== */

$("txForm").onsubmit =
async function(e) {

  e.preventDefault();


  if (!user) {

    alert(
      "Silakan login terlebih dahulu."
    );

    return;

  }


  const type =
    $("type").value;

  const amount =
    Number(
      $("amount").value
    );

  const date =
    $("date").value;

  const category =
    $("cat").value;

  const note =
    $("note").value.trim();


  if (!amount || amount <= 0) {

    alert(
      "Nominal harus lebih dari 0."
    );

    return;

  }


  if (!date) {

    alert(
      "Tanggal wajib diisi."
    );

    return;

  }


  /*
   * HTML menggunakan:
   * income / expense
   *
   * Google Sheets menggunakan:
   * pemasukan / pengeluaran
   */

  const jenis =
    type === "income"
      ? "pemasukan"
      : "pengeluaran";


  try {

    const result =
      await api(
        "addTransaction",
        {

          user_id:
            user.id,

          jenis:
            jenis,

          tanggal:
            date,

          kategori:
            category,

          nominal:
            amount,

          keterangan:
            note

        }
      );


    alert(
      result.message ||
      "Transaksi berhasil disimpan."
    );


    $("txForm").reset();


    $("date").value =
      new Date()
        .toISOString()
        .slice(0,10);


    await loadTx();


  } catch (error) {

    alert(
      "Gagal menyimpan transaksi:\n" +
      error.message
    );

  }

};


/* =====================================================
   AMBIL TRANSAKSI DARI GOOGLE SHEETS
   ===================================================== */

async function loadTx() {

  if (!user) return;


  $("list").innerHTML =
    '<div class="empty">Memuat data...</div>';


  try {

    const result =
      await api(
        "listTransactions",
        {

          user_id:
            user.id

        }
      );


    tx =
      result.transactions || [];


    render();


  } catch (error) {

    $("list").innerHTML =
      '<div class="empty">' +
      esc(error.message) +
      "</div>";

  }

}


/* =====================================================
   HITUNG SALDO
   ===================================================== */

function render() {

  const now =
    new Date();


  const yearMonth =
    now.toISOString()
      .slice(0,7);


  /*
   * Hanya transaksi bulan berjalan
   */

  const current =
    tx.filter(
      item =>
        String(item.tanggal)
          .slice(0,7) === yearMonth
    );


  let pemasukan = 0;
  let pengeluaran = 0;


  current.forEach(
    item => {

      const nominal =
        Number(item.nominal) || 0;


      if (
        item.jenis === "pemasukan"
      ) {

        pemasukan += nominal;

      }


      if (
        item.jenis === "pengeluaran"
      ) {

        pengeluaran += nominal;

      }

    }
  );


  const saldo =
    pemasukan -
    pengeluaran;


  $("income").textContent =
    money(pemasukan);


  $("expense").textContent =
    money(pengeluaran);


  $("balance").textContent =
    money(saldo);


  $("count").textContent =
    current.length;


  $("monthLabel").textContent =
    now.toLocaleDateString(
      "id-ID",
      {
        month: "long",
        year: "numeric"
      }
    );


  /*
   * Riwayat
   */

  const sorted =
    tx.slice().sort(
      (a,b) =>
        String(b.tanggal)
          .localeCompare(
            String(a.tanggal)
          )
    );


  if (!sorted.length) {

    $("list").innerHTML =
      '<div class="empty">' +
      "Belum ada transaksi." +
      "</div>";

    return;

  }


  $("list").innerHTML =
    sorted.map(
      item => {

        const pemasukan =
          item.jenis === "pemasukan";


        return `
          <div class="tx">

            <div>

              <b>
                ${esc(
                  item.kategori ||
                  "Lainnya"
                )}
              </b>

              <small>
                ${esc(
                  item.tanggal || ""
                )}
                ·
                ${esc(
                  item.keterangan || ""
                )}
              </small>

            </div>

            <strong
              class="${
                pemasukan
                  ? "income"
                  : "expense"
              }"
            >

              ${
                pemasukan
                  ? "+"
                  : "-"
              }

              ${money(item.nominal)}

            </strong>

          </div>
        `;

      }
    ).join("");

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m) {

        return {

          "&":
            "&amp;",

          "<":
            "&lt;",

          ">":
            "&gt;",

          '"':
            "&quot;",

          "'":
            "&#039;"

        }[m];

      }
    );

}


/* =====================================================
   BUKA APLIKASI
   ===================================================== */

function openApp() {

  $("auth")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  $("hello").textContent =
    "Halo, " +
    (
      user.nama ||
      user.name ||
      "Pengguna"
    ) +
    " 👋";


  $("date").value =
    new Date()
      .toISOString()
      .slice(0,10);


  loadTx();

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

  sessionStorage.removeItem(
    "duitUser"
  );


  user = null;

  tx = [];


  location.reload();

}


/* =====================================================
   LOAD SESSION
   ===================================================== */

try {

  const saved =
    sessionStorage.getItem(
      "duitUser"
    );


  if (saved) {

    user =
      JSON.parse(saved);


    openApp();

  }

} catch (error) {

  console.error(
    "Session error:",
    error
  );

}
</script>
